[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=82.0.1",
    "wheel>=0.46.3",
    "packaging>=26.0",
    "torch>=2.6.0",
    "ninja>=1.13.0",
    "psutil>=7.2.2",
    "numpy>=2.0.0"
]


[project]
name = "flash-attn"
version = "2.8.3"
description = "FlashAttention-2 for NVIDIA Volta GPUs (drop-in flash-attn API)"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "AUTHORS"]
dynamic = ["authors", "classifiers", "urls"]
dependencies = [
    "torch>=2.6.0",
    "einops",
    "setuptools>=82.0.1",
    "wheel>=0.46.3",
    "packaging>=26.0",
    "ninja>=1.13.0",
    "psutil>=7.2.2",
    "numpy>=2.0.0"
]

[tool.setuptools.exclude-package-data]
"*" = [
    "build",
    "kernel",
    "include",
    "flash_attn.egg-info",
    "*.cu",
    "*.cuh",
    "*.cpp",
    "*.h"
]
